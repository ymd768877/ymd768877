openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: Gaming platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: games
  - name: announcements
  - name: promotions
  - name: transactions
  - name: admin

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /games:
    get:
      operationId: getGames
      tags: [games]
      summary: Get games
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [hot, favorites, slots, all]
      responses:
        "200":
          description: Games list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"

  /announcements:
    get:
      operationId: getAnnouncements
      tags: [announcements]
      summary: Get active announcements
      responses:
        "200":
          description: Announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"

  /promotions:
    get:
      operationId: getPromotions
      tags: [promotions]
      summary: Get active promotions
      responses:
        "200":
          description: Promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Promotion"

  /transactions:
    get:
      operationId: getMyTransactions
      tags: [transactions]
      summary: Get my transactions
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /transactions/withdraw:
    post:
      operationId: requestWithdraw
      tags: [transactions]
      summary: Request a withdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawRequest"
      responses:
        "201":
          description: Withdrawal requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions/game/bet:
    post:
      operationId: placeBet
      tags: [transactions]
      summary: Place a game bet (deducts balance)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameBetRequest"
      responses:
        "200":
          description: Bet placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions/game/win:
    post:
      operationId: claimWin
      tags: [transactions]
      summary: Claim game winnings (adds balance)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameWinRequest"
      responses:
        "200":
          description: Win credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions/deposit:
    post:
      operationId: requestDeposit
      tags: [transactions]
      summary: Request a deposit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositRequest"
      responses:
        "201":
          description: Deposit requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Admin login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Admin dashboard stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: Get all users
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /admin/users/{userId}/balance:
    put:
      operationId: updateUserBalance
      tags: [admin]
      summary: Update user balance
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBalanceRequest"
      responses:
        "200":
          description: Balance updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{userId}/status:
    put:
      operationId: updateUserStatus
      tags: [admin]
      summary: Update user status
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/transactions:
    get:
      operationId: getAdminTransactions
      tags: [admin]
      summary: Get all transactions
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Transactions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionWithUser"

  /admin/transactions/{transactionId}/status:
    put:
      operationId: updateTransactionStatus
      tags: [admin]
      summary: Approve or reject a deposit
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTransactionStatusRequest"
      responses:
        "200":
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /admin/announcements:
    get:
      operationId: getAdminAnnouncements
      tags: [admin]
      summary: Get all announcements
      responses:
        "200":
          description: Announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
    post:
      operationId: createAnnouncement
      tags: [admin]
      summary: Create announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnnouncementRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"

  /admin/announcements/{announcementId}:
    put:
      operationId: updateAnnouncement
      tags: [admin]
      summary: Update announcement
      parameters:
        - name: announcementId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnnouncementRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
    delete:
      operationId: deleteAnnouncement
      tags: [admin]
      summary: Delete announcement
      parameters:
        - name: announcementId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/games:
    post:
      operationId: createGame
      tags: [admin]
      summary: Create a game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /admin/games/{gameId}:
    put:
      operationId: updateGame
      tags: [admin]
      summary: Update a game
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
    delete:
      operationId: deleteGame
      tags: [admin]
      summary: Delete a game
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/promotions:
    post:
      operationId: createPromotion
      tags: [admin]
      summary: Create a promotion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromotionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promotion"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    RegisterRequest:
      type: object
      required: [username, phone, password]
      properties:
        username:
          type: string
        phone:
          type: string
        password:
          type: string

    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
        password:
          type: string

    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    User:
      type: object
      required: [id, username, phone, balance, status, role, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        phone:
          type: string
        balance:
          type: number
        status:
          type: string
          enum: [active, banned]
        role:
          type: string
          enum: [user, admin]
        createdAt:
          type: string
          format: date-time

    Game:
      type: object
      required: [id, name, category, provider, imageUrl, isActive]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
          enum: [hot, favorites, slots]
        provider:
          type: string
        imageUrl:
          type: string
        multiplier:
          type: string
        isActive:
          type: boolean

    Announcement:
      type: object
      required: [id, message, isActive, createdAt]
      properties:
        id:
          type: integer
        message:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Promotion:
      type: object
      required: [id, title, description, isActive]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        isActive:
          type: boolean

    Transaction:
      type: object
      required: [id, userId, type, amount, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
          enum: [deposit, withdrawal, credit, debit]
        amount:
          type: number
        status:
          type: string
          enum: [pending, approved, rejected]
        note:
          type: string
        senderPhone:
          type: string
        createdAt:
          type: string
          format: date-time

    TransactionWithUser:
      allOf:
        - $ref: "#/components/schemas/Transaction"
        - type: object
          properties:
            user:
              $ref: "#/components/schemas/User"

    WithdrawRequest:
      type: object
      required: [amount, receiverPhone]
      properties:
        amount:
          type: number
        receiverPhone:
          type: string
        note:
          type: string

    GameBetRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number

    GameWinRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number

    DepositRequest:
      type: object
      required: [amount, senderPhone]
      properties:
        amount:
          type: number
        senderPhone:
          type: string
        note:
          type: string

    UpdateBalanceRequest:
      type: object
      required: [amount, type]
      properties:
        amount:
          type: number
        type:
          type: string
          enum: [add, subtract, set]
        note:
          type: string

    UpdateStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, banned]

    UpdateTransactionStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected]
        note:
          type: string

    CreateAnnouncementRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
        isActive:
          type: boolean

    CreateGameRequest:
      type: object
      required: [name, category, provider, imageUrl]
      properties:
        name:
          type: string
        category:
          type: string
          enum: [hot, favorites, slots]
        provider:
          type: string
        imageUrl:
          type: string
        multiplier:
          type: string
        isActive:
          type: boolean

    CreatePromotionRequest:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        isActive:
          type: boolean

    DashboardStats:
      type: object
      required: [totalUsers, activeUsers, pendingDeposits, totalDeposited, totalBalance]
      properties:
        totalUsers:
          type: integer
        activeUsers:
          type: integer
        pendingDeposits:
          type: integer
        totalDeposited:
          type: number
        totalBalance:
          type: number
        recentTransactions:
          type: array
          items:
            $ref: "#/components/schemas/TransactionWithUser"
        recentUsers:
          type: array
          items:
            $ref: "#/components/schemas/User"
